# ── CONFIG TEMPLATE ──────────────────────────────────────────────────────────
# Setup (once):  cp config.example.yaml config.yaml  → then set local values.
# The real config.yaml is GITIGNORED (holds dev DB host 192.168.5.5 + secrets);
# this template is committed. Environment variables may override nested keys.
# ─────────────────────────────────────────────────────────────────────────────
server:
  # Dev-stage: bind loopback so Windows Firewall never prompts (go run re-compiles
  # to a new temp exe each time → repeated prompts on 0.0.0.0). Prod hardening:
  # 生产环境可绑定所有接口（":8086"）；本地约束见 flightdeck/knowledge/local-dev/local-environment.md。
  address: "127.0.0.1:8086"
  # Matches the Docs import gateway ceiling; ordinary JSON endpoints remain
  # constrained by their schemas and the shared BFF budget.
  clientMaxBodySize: 104857600
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
logger:
  level: "info"
  stdout: true
database:
  default:
    # GoFrame's pgsql driver builds the DSN from these structured fields.
    # DOCS_DATABASE_URL is the preferred process-level override.
    type: "pgsql"
    host: "127.0.0.1"
    port: "5432"
    user: "postgres"
    pass: "postgres"
    name: "docs"

docs:
  projectDocs:
    # Dedicated base64 32-byte AES key for revocable source PATs; empty disables sync.
    encryptionKey: ""
    # Optional token for GitHub public API quota; never forwarded to asset hosts.
    githubToken: ""
  personalTokens:
    # Must equal this site's OIDC audience; empty disables personal-token access.
    siteId: ""
    allowHTTP: false
  siteSlug: "docs-local"
  brand: "文档库"
  domain: "docs.localhost"
  siteUrl: "http://localhost:3003"
  siteDescription: "指南、参考与教程"
  discovery:
    ttl: "5m"
  traffic:
    # Traffic 实例创建后不可修改；决定每日边界与访客日归属。
    timeZone: "Asia/Shanghai"
  assetSpace: "default"
  assetNamespace: "docs"
  assetProfile: "docs-default"
  authorization:
    # Empty: an authenticated user explicitly claims /manage/setup once.
    # Set existing Identity subjects only for unattended bootstrap/recovery.
    bootstrapAdministratorSubs: []
  abuse:
    turnstile:
      secret: ""            # optional; enable challenge escalation when configured
      endpoint: ""          # empty uses Cloudflare Siteverify
      hostnames: []         # trusted public hosts; never infer from request Host
  # IdP JWKS for user access-token verification (Foundation auth). Lazy-fetched.
  jwks:
    url: "http://localhost:8081/oauth2/jwks.json"
    issuer: "http://localhost:8081"
    audience: ""
    allowLoopbackHttp: true # local development only
  identity:
    baseUrl: "http://localhost:8081"
  assetService:
    baseUrl: "http://localhost:8082"
    # Existing registered Asset machine client; production injects the secret.
    clientId: "docs-asset-svc"
    clientSecret: ""
    publicOrigin: ""
  coverCategory: "docs-collection-cover"
